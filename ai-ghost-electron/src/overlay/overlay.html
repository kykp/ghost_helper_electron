<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; worker-src 'self' blob:; img-src 'self' data:;"
    />
    <title>AI Ghost Overlay</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="hint-container">
      <!-- Шапка: логотип + индикатор статуса -->
      <div id="hint-bar">
        <div class="ghost-logo">
          <svg class="ghost-icon" viewBox="0 0 24 24" fill="none">
            <path
              d="M12 2C7.58 2 4 5.58 4 10v8.5c0 .83.67 1.5 1.5 1.5s1-.67 1-1.5.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.17 1.5-1 1.5S10 21 10 21h4s-.17-.5-1-1.5.5-1.5 1.5-1.5 1.5.67 1.5 1.5-.5 1.5 1 1.5 1.5-.67 1.5-1.5V10c0-4.42-3.58-8-8-8z"
              fill="rgba(99,102,241,0.55)"
            />
            <circle cx="9.5" cy="10" r="1.2" fill="rgba(255,255,255,0.95)" />
            <circle cx="14.5" cy="10" r="1.2" fill="rgba(255,255,255,0.95)" />
          </svg>
          <span id="hint-title">Ghost</span>
        </div>
        <div class="ghost-status">
          <div id="status-dot" class="listening"></div>
          <span id="status-label">слушаю</span>
        </div>
        <button id="hide-btn" title="Свернуть в трей — Cmd+Shift+G">–</button>
        <button id="quit-btn" title="Закрыть AI Ghost">✕</button>
      </div>

      <!-- Панель управления -->
      <div id="hint-controls">
        <button id="mic-toggle" title="Мой микрофон вкл/выкл — Cmd+Shift+M">
          Мой микрофон вкл
        </button>
        <button id="sys-toggle" title="Микрофон собеседника вкл/выкл">
          Собеседник вкл
        </button>
        <button id="clear-btn" title="Очистить ленту ответов">
          Очистить беседу
        </button>
        <button id="opacity-full" title="Фон окна полностью виден">100%</button>
        <button id="opacity-low" title="Фон окна почти прозрачный">20%</button>
        <button id="settings-btn" title="Настройки — Cmd+Shift+S">⚙</button>
      </div>

      <!-- Режим «решение задачи»: снимки области экрана под окном -->
      <div id="shots-panel">
        <div id="shots-row">
          <button
            id="shots-capture"
            title="Выделить область экрана для снимка — Cmd+Shift+C"
          >
            📷 Снимок
          </button>
          <span id="shots-count">0 / 5</span>
          <button id="shots-solve" title="Отправить снимки и получить решение">
            🧩 Решить
          </button>
        </div>
        <div id="shots-thumbs"></div>
      </div>

      <!-- Бегущая строка: последняя распознанная речь -->
      <div id="ghost-ticker">
        <svg class="ticker-icon" viewBox="0 0 24 24" fill="none">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" stroke="currentColor" stroke-width="1.5" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <span id="ticker-text">…ожидание речи</span>
      </div>

      <!-- Лента подсказок -->
      <div id="hint-list"></div>
    </div>

    <!-- Ручки изменения размеров окна — по краям и углам (см. overlay.js) -->
    <div class="rsz n" data-dir="n"></div>
    <div class="rsz s" data-dir="s"></div>
    <div class="rsz e" data-dir="e"></div>
    <div class="rsz w" data-dir="w"></div>
    <div class="rsz nw" data-dir="nw"></div>
    <div class="rsz ne" data-dir="ne"></div>
    <div class="rsz sw" data-dir="sw"></div>
    <div class="rsz se" data-dir="se"></div>

    <!-- VAD-движок (vendored): сначала onnxruntime, затем vad-web -->
    <script src="../vendor/vad/ort.wasm.min.js"></script>
    <script src="../vendor/vad/vad.bundle.min.js"></script>

    <!-- Модули приложения (классы — глобальные; порядок важен) -->
    <script src="../utils/buffer.js"></script>
    <script src="../triggers/trigger-manager.js"></script>
    <script src="../audio/vad-listener.js"></script>
    <script src="../screen/screen-capture.js"></script>
    <script src="../ai/openai-client.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
